<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF9F5" />
  <title>NavGPT — Ask Naveen</title>
  <link rel="icon" href="/icons/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <style>
    :root {
      --bg: #FAF9F5;
      --panel: #FFFFFF;
      --accent: #D97757;
      --accent-dark: #BF5E3F;
      --accent-light: #F3E4DB;
      --text: #2D2A26;
      --muted: #83786C;
      --border: #EAE5DC;
      --border-soft: #F0ECE4;
      --shadow: 0 1px 2px rgba(45, 42, 38, 0.04), 0 2px 8px rgba(45, 42, 38, 0.04);
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --sidebar-w: 260px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      overscroll-behavior: none;
      overflow: hidden; /* Prevent page from scrolling up when keyboard opens */
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- Sidebar ---------- */
    #sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--panel);
      border-right: 1px solid var(--border-soft);
      display: flex;
      flex-direction: column;
      padding: calc(12px + var(--safe-top)) 10px 10px;
      transition: transform 0.22s ease;
      z-index: 30;
    }

    #newChatBtn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
      font-family: inherit;
    }

    #newChatBtn:hover {
      background: var(--accent-dark);
    }

    #chatList {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .chat-item {
      padding: 9px 10px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .chat-item:hover {
      background: var(--border-soft);
    }

    .chat-item.active {
      background: var(--accent-light);
      color: var(--accent-dark);
      font-weight: 600;
    }

    .chat-item .chat-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-item .chat-delete {
      opacity: 0;
      color: var(--muted);
      font-size: 0.8rem;
      padding: 2px 5px;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .chat-item:hover .chat-delete {
      opacity: 1;
    }

    .chat-item .chat-delete:hover {
      background: var(--border);
      color: var(--text);
    }

    #loadMoreChatsBtn {
      display: block;
      width: 100%;
      background: none;
      border: 1px dashed var(--border);
      color: var(--muted);
      border-radius: var(--radius-sm);
      padding: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      margin-top: 6px;
      font-family: inherit;
    }

    #loadMoreChatsBtn:hover {
      background: var(--border-soft);
      color: var(--text);
    }

    #loadMoreChatsBtn:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    #sidebarOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(45, 42, 38, 0.3);
      z-index: 20;
    }

    /* ---------- Main column ---------- */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    header {
      padding: calc(12px + var(--safe-top)) 20px 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--border-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #menuBtn {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      color: var(--text);
      font-size: 1.1rem;
      border-radius: 8px;
    }

    #menuBtn:hover {
      background: var(--border-soft);
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(191, 94, 63, 0.28);
    }

    .brand-mark img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    header h1 {
      font-size: 1.02rem;
      margin: 0;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .icon-spin {
      animation: spin 1.3s linear infinite;
    }

    /* ---------- Model picker ---------- */
    #modelPickerWrap {
      position: relative;
    }

    #modelPickerBtn {
      display: flex;
      align-items: center;
      gap: 7px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 11px;
      font-size: 0.82rem;
      font-family: inherit;
      color: var(--text);
      cursor: pointer;
      max-width: 190px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      white-space: nowrap;
      overflow: hidden;
    }

    #modelPickerBtn:hover {
      background: var(--panel);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-light);
    }

    #modelPickerBtn.open {
      background: var(--panel);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-light);
    }

    #modelPickerBtn .mpb-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    #modelPickerBtn .mpb-label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }

    #modelPickerBtn .mpb-caret {
      flex-shrink: 0;
      font-size: 0.7rem;
      color: var(--muted);
      transition: transform 0.2s ease;
      margin-left: 2px;
    }

    #modelPickerBtn.open .mpb-caret {
      transform: rotate(180deg);
    }

    /* Dropdown panel */
    #modelPickerPanel {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: 270px;
      background: var(--panel);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      box-shadow: 0 8px 32px rgba(45, 42, 38, 0.14), 0 2px 8px rgba(45, 42, 38, 0.06);
      z-index: 100;
      padding: 8px;
      display: none;
      flex-direction: column;
      gap: 4px;
      animation: mpDrop 0.18s ease-out;
    }

    #modelPickerPanel.open {
      display: flex;
    }

    @keyframes mpDrop {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .mp-group-label {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      padding: 6px 8px 2px;
      margin-top: 4px;
    }

    .mp-group-label:first-child {
      margin-top: 0;
    }

    .mp-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.13s ease;
      border: 1.5px solid transparent;
      position: relative;
    }

    .mp-card:hover {
      background: var(--border-soft);
    }

    .mp-card.selected {
      background: var(--accent-light);
      border-color: var(--accent);
    }

    .mp-card .mp-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
      font-style: normal;
    }

    /* Provider colour tokens */
    .mp-icon.prov-nvidia  { background: #76b900; color: #fff; }
    .mp-icon.prov-openrouter { background: #6c47ff; color: #fff; }
    .mp-icon.prov-gemini  { background: linear-gradient(135deg, #4285f4 0%, #34a853 50%, #ea4335 100%); color: #fff; }

    .mp-info {
      flex: 1;
      min-width: 0;
    }

    .mp-name {
      font-size: 0.86rem;
      font-weight: 600;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .mp-badge {
      font-size: 0.68rem;
      color: var(--muted);
      margin-top: 1px;
    }

    .mp-check {
      font-size: 0.85rem;
      color: var(--accent-dark);
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.12s ease;
    }

    .mp-card.selected .mp-check {
      opacity: 1;
    }

    @media (max-width: 640px) {
      #modelPickerBtn {
        max-width: 120px;
        font-size: 0.76rem;
        padding: 6px 9px;
      }

      #modelPickerPanel {
        width: 240px;
      }
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #authArea button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 9px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 500;
      font-family: inherit;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    #authArea button:hover {
      background: var(--accent-dark);
    }

    #authArea button:active {
      transform: scale(0.97);
    }

    #signOutBtn {
      background: transparent !important;
      color: var(--muted) !important;
      border: 1px solid var(--border) !important;
      padding: 7px 14px !important;
    }

    #signOutBtn:hover {
      background: var(--border-soft) !important;
      color: var(--text) !important;
    }

    #userInfo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: var(--text);
      font-weight: 500;
    }

    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent-light);
      color: var(--accent-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    /* ---------- Chat window ---------- */
    #chatWindow {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px 12px;
      max-width: 760px;
      margin: 0 auto;
      width: 100%;
      -webkit-overflow-scrolling: touch;
      /* Extra bottom padding on mobile so content isn't hidden behind the fixed input bar */
    }

    #loadMoreMessagesBtn {
      display: block;
      margin: 0 auto 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: var(--radius-sm);
      padding: 8px 16px;
      font-size: 0.82rem;
      cursor: pointer;
      font-family: inherit;
    }

    #loadMoreMessagesBtn:hover {
      background: var(--border-soft);
      color: var(--text);
    }

    #loadMoreMessagesBtn:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    .msg {
      margin-bottom: 18px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      animation: rise 0.22s ease-out;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .msg.user {
      justify-content: flex-end;
    }

    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      margin-bottom: 2px;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .bubble {
      max-width: 72%;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      line-height: 1.55;
      white-space: pre-wrap;
      font-size: 0.95rem;
      word-wrap: break-word;
    }

    .msg.user .bubble {
      background: var(--accent);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .msg.bot .bubble {
      background: var(--panel);
      border: 1px solid var(--border-soft);
      box-shadow: var(--shadow);
      border-bottom-left-radius: 4px;
    }

    .export-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
    }

    .export-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-light);
      color: var(--accent-dark);
      border: none;
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s ease;
    }

    .export-btn:hover {
      background: var(--border);
    }

    .export-btn:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    .export-btn.attach-btn {
      background: transparent;
      color: var(--muted);
      border: 1px dashed var(--border);
    }

    .export-btn.attach-btn:hover {
      background: var(--border-soft);
      color: var(--text);
    }

    .export-btn.attach-btn.has-image {
      color: var(--accent-dark);
      border-style: solid;
      border-color: var(--border);
    }

    .export-footer-input {
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 0.8rem;
      font-family: inherit;
      color: var(--text);
      background: transparent;
      min-width: 180px;
      flex: 1;
    }

    .export-footer-input:focus {
      outline: none;
      border-color: var(--accent);
      border-style: solid;
      background: var(--bg);
    }

    .export-footer-input::placeholder {
      color: var(--muted);
    }

    .reasoning-block {
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px dashed var(--border);
      color: var(--muted);
      font-size: 0.85rem;
      font-style: italic;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    /* Rendered markdown inside bot replies */
    .content-text {
      white-space: normal;
    }

    .content-text>*:first-child {
      margin-top: 0;
    }

    .content-text>*:last-child {
      margin-bottom: 0;
    }

    .content-text p {
      margin: 0 0 10px;
    }

    .content-text h1,
    .content-text h2,
    .content-text h3 {
      font-size: 1.02rem;
    }

    .content-text strong {
      font-weight: 700;
      color: var(--text);
    }

    .content-text em {
      font-style: italic;
    }

    .content-text ul,
    .content-text ol {
      margin: 0 0 10px;
      padding-left: 22px;
    }

    .content-text li {
      margin-bottom: 4px;
    }

    .content-text li>p {
      margin: 0;
    }

    .content-text a {
      color: var(--accent-dark);
      text-decoration: underline;
    }

    .content-text code {
      background: var(--border-soft);
      border-radius: 4px;
      padding: 2px 5px;
      font-size: 0.85em;
      font-family: "SF Mono", Consolas, Monaco, monospace;
    }

    .content-text pre {
      background: #2D2A26;
      color: #FAF9F5;
      border-radius: 8px;
      padding: 12px 14px;
      overflow-x: auto;
      margin: 0 0 10px;
      font-size: 0.85em;
    }

    .content-text pre code {
      background: none;
      padding: 0;
      color: inherit;
    }

    .content-text blockquote {
      border-left: 3px solid var(--accent);
      margin: 0 0 10px;
      padding: 2px 0 2px 12px;
      color: var(--muted);
      font-style: italic;
    }

    .content-text hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 12px 0;
    }

    .content-text table {
      border-collapse: collapse;
      margin: 0 0 10px;
      font-size: 0.9em;
    }

    .content-text th,
    .content-text td {
      border: 1px solid var(--border);
      padding: 6px 10px;
    }

    .content-text th {
      background: var(--border-soft);
      font-weight: 600;
    }

    .reasoning-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--accent-dark);
      font-style: normal;
      display: block;
      margin-bottom: 4px;
    }

    .stream-cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--accent);
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 0.9s steps(1) infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    .typing-dots {
      display: flex;
      gap: 4px;
      padding: 4px 2px;
    }

    .typing-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      opacity: 0.5;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes bounce {

      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: 0.5;
      }

      30% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    .queue-status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .queue-status .queue-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .queue-status strong {
      color: var(--text);
      font-weight: 600;
    }

    #signedOutNotice {
      max-width: 420px;
      margin: 15vh auto 0;
      text-align: center;
      color: var(--muted);
      padding: 0 24px;
    }

    #signedOutNotice .empty-mark {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      overflow: hidden;
      margin: 0 auto 18px;
    }

    #signedOutNotice .empty-mark img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    #signedOutNotice h2 {
      color: var(--text);
      font-size: 1.15rem;
      margin: 0 0 8px;
      font-weight: 600;
    }

    #signedOutNotice p {
      font-size: 0.92rem;
      line-height: 1.5;
      margin: 0;
    }

    #inputBar {
      border-top: 1px solid var(--border-soft);
      background: var(--panel);
      padding: 14px 20px calc(14px + var(--safe-bottom));
      display: flex;
      gap: 10px;
      max-width: 760px;
      margin: 0 auto;
      width: 100%;
      align-items: flex-end;
      flex-shrink: 0;
    }

    #inputBar textarea {
      flex: 1;
      resize: none;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 11px 14px;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
      line-height: 1.4;
      max-height: 140px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    #inputBar textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-light);
      background: var(--panel);
    }

    #inputBar textarea::placeholder {
      color: var(--muted);
    }

    #inputBar button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      padding: 0 20px;
      height: 42px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.92rem;
      font-family: inherit;
      flex-shrink: 0;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    #inputBar button:hover:not(:disabled) {
      background: var(--accent-dark);
    }

    #inputBar button:active:not(:disabled) {
      transform: scale(0.96);
    }

    #inputBar button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #inputBar button:focus-visible,
    #authArea button:focus-visible,
    #inputBar textarea:focus-visible {
      outline: 2px solid var(--accent-dark);
      outline-offset: 2px;
    }

    #chatWindow::-webkit-scrollbar,
    #chatList::-webkit-scrollbar {
      width: 8px;
    }

    #chatWindow::-webkit-scrollbar-track,
    #chatList::-webkit-scrollbar-track {
      background: transparent;

    /* =========================================================
       DOCUMENT EXPORT PARSING (unchanged logic)
       ========================================================= */
    function tryRepairTruncatedJson(text) {
      try { return JSON.parse(text); } catch { }

      let stack = [];
      let inString = false;
      let escape = false;
      let lastSafeIndex = -1;

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (inString) {
          if (escape) escape = false;
          else if (ch === "\\") escape = true;
          else if (ch === '"') inString = false;
          continue;
        }
        if (ch === '"') { inString = true; continue; }
        if (ch === "{" || ch === "[") { stack.push(ch); continue; }
        if (ch === "}" || ch === "]") {
          stack.pop();
          lastSafeIndex = i;
          continue;
        }
        if (ch === ",") lastSafeIndex = i;
      }

      if (lastSafeIndex === -1) return null;
      let truncated = text.slice(0, lastSafeIndex + 1).replace(/,\s*$/, "");

      stack = [];
      inString = false;
      escape = false;
      for (let i = 0; i < truncated.length; i++) {
        const ch = truncated[i];
        if (inString) {
          if (escape) escape = false;
          else if (ch === "\\") escape = true;
          else if (ch === '"') inString = false;
          continue;
        }
        if (ch === '"') { inString = true; continue; }
        if (ch === "{" || ch === "[") stack.push(ch);
        else if (ch === "}" || ch === "]") stack.pop();
      }

      if (inString) truncated += '"';

      let closer = "";
      for (let i = stack.length - 1; i >= 0; i--) closer += stack[i] === "{" ? "}" : "]";

      try {
        return JSON.parse(truncated + closer);
      } catch (err) {
        console.error("JSON repair attempt failed:", err, "\nAttempted:", truncated + closer);
        return null;
      }
    }

    function isWellFormedBullet(str) {
      if (typeof str !== "string") return false;
      const trimmed = str.trim();
      if (trimmed.length < 12) return false;

      const words = trimmed.split(/\s+/).filter(Boolean);
      if (words.length < 3) return false;

      const lastWord = words[words.length - 1].toLowerCase().replace(/[.,;:!?)"'”’]+$/, "");
      const danglingConnectors = new Set([
        "a", "an", "the", "and", "or", "but", "of", "to", "in", "on", "for",
        "with", "is", "are", "was", "were", "this", "that", "these", "those",
        "binary", "decimal", "octal", "hexadecimal",
      ]);
      if (danglingConnectors.has(lastWord)) return false;

      if (/[-–—]\s*$/.test(trimmed.replace(/[.!?]+$/, ""))) return false;

      const endsOk = /[.!?)\u2019\u201d\d%]$/.test(trimmed) || /[a-zA-Z0-9]₀|₁|₂|₃|₄|₅|₆|₇|₈|₉$/.test(trimmed);
      return endsOk || /[a-z0-9]$/i.test(trimmed);
    }

    function findExportBlockBounds(fullText) {
      const fenceRe = /```([a-zA-Z-]*)\n?/g;
      let m;
      while ((m = fenceRe.exec(fullText)) !== null) {
        const tag = (m[1] || "").toLowerCase();
        const contentStart = m.index + m[0].length;
        const closeIdx = fullText.indexOf("```", contentStart);
        const contentEnd = closeIdx === -1 ? fullText.length : closeIdx;
        const inner = fullText.slice(contentStart, contentEnd).trim();
        const looksJsonTag = tag === "" || tag.includes("json");
        const looksJsonBody = inner.startsWith("{") && /"sections"\s*:/.test(inner);
        if (looksJsonTag && looksJsonBody) {
          return {
            startIdx: m.index,
            jsonChunk: inner,
            blockEndInFullText: closeIdx === -1 ? fullText.length : closeIdx + 3,
            wasTruncated: closeIdx === -1,
          };
        }
      }

      const firstBrace = fullText.indexOf("{");
      if (firstBrace !== -1 && /"sections"\s*:/.test(fullText.slice(firstBrace, firstBrace + 4000))) {
        let depth = 0, inString = false, escape = false, endIdx = -1;
        for (let i = firstBrace; i < fullText.length; i++) {
          const ch = fullText[i];
          if (inString) {
            if (escape) escape = false;
            else if (ch === "\\") escape = true;
            else if (ch === '"') inString = false;
            continue;
          }
          if (ch === '"') { inString = true; continue; }
          if (ch === "{") depth++;
          else if (ch === "}") { depth--; if (depth === 0) { endIdx = i + 1; break; } }
        }
        const jsonChunk = fullText.slice(firstBrace, endIdx === -1 ? fullText.length : endIdx);
        if (jsonChunk.trim().startsWith("{")) {
          return {
            startIdx: firstBrace,
            jsonChunk: jsonChunk.trim(),
            blockEndInFullText: endIdx === -1 ? fullText.length : endIdx,
            wasTruncated: endIdx === -1,
          };
        }
      }

      return null;
    }

    function parseExportBlock(fullText) {
      const bounds = findExportBlockBounds(fullText);
      if (!bounds) return { displayText: fullText, exportData: null };

      const { startIdx, jsonChunk, blockEndInFullText } = bounds;
      let exportData = null;
      let wasTruncated = bounds.wasTruncated;
      try {
        exportData = JSON.parse(jsonChunk);
      } catch {
        exportData = tryRepairTruncatedJson(jsonChunk);
        wasTruncated = true;
        if (exportData) {
          console.warn("Recovered a truncated export-json block.");
        } else {
          console.error("Could not parse or repair export-json block.");
        }
      }

      if (exportData) {
        const originalCount = Array.isArray(exportData.sections)
          ? exportData.sections.reduce((n, s) => n + (Array.isArray(s?.content) ? s.content.length : 0), 0)
          : 0;
        exportData = dropIncompleteSections(exportData);
        const newCount = exportData.sections.reduce((n, s) => n + s.content.length, 0);
        if (newCount !== originalCount) wasTruncated = true;
      }

      if (exportData && (!Array.isArray(exportData.sections) || exportData.sections.length === 0)) {
        exportData = null;
      }

      const displayText = (fullText.slice(0, startIdx) + fullText.slice(blockEndInFullText)).trim();
      return { displayText, exportData, wasTruncated: wasTruncated && !!exportData };
    }

    const DOC_REQUEST_REGEX = /\b(presentation|slide\s*deck|slides?|ppt|pptx|power\s*point|word\s*doc(?:ument)?|docx|pdf|report)\b/i;

    function looksLikeDocumentRequest(text) {

    function buildFallbackExportData(userMessage, rawText) {
      let tokens;

        tokens = marked.lexer(rawText || "");
