      const sections = [];
      let current = null;

      function pushContent(text) {
        const trimmed = (text || "").replace(/\s+/g, " ").trim();
        if (!trimmed) return;
        if (!current) {
          current = { heading: "Overview", content: [] };
          sections.push(current);
        }
        if (trimmed.length > 220) {
          trimmed.split(/(?<=[.!?])\s+(?=[A-Z0-9])/).forEach((sentence) => {
            const s = sentence.trim();
            if (s && isWellFormedBullet(s)) current.content.push(s);
          });
        } else if (isWellFormedBullet(trimmed)) {
          current.content.push(trimmed);
        }
      }

      tokens.forEach((token) => {
        if (token.type === "heading" && token.depth <= 3) {
          const headingText = (token.text || "").replace(/\*\*/g, "").trim();
          if (headingText) {
            current = { heading: headingText, content: [] };
            sections.push(current);
          }
        } else if (token.type === "list") {
          (token.items || []).forEach((item) => pushContent(item.text));
        } else if (token.type === "paragraph" || token.type === "text") {
          pushContent(token.text);
        } else if (token.type === "table" && Array.isArray(token.rows)) {
          token.rows.forEach((row) => {
            pushContent(row.map((cell) => cell.text).join(" — "));
          });
        }
      });

      const cleanedSections = sections
        .map((s) => ({ heading: s.heading, content: (s.content || []).filter(Boolean) }))
        .filter((s) => s.heading && s.content.length > 0);

      if (!cleanedSections.length) return null;

      const title = (userMessage || "Document")
        .replace(/\b(create|generate|make|build|give\s*me|write)\b/gi, "")
        .replace(DOC_REQUEST_REGEX, "")
        .replace(/\b(a|an|the|for|about|on)\b/gi, "")
        .replace(/\s+/g, " ")
        .trim();

      return {
        title: title ? title.charAt(0).toUpperCase() + title.slice(1) : "Document",
        sections: cleanedSections,
      };
    }

    function dropIncompleteSections(exportData) {
      if (!exportData || !Array.isArray(exportData.sections)) return exportData;
      const cleaned = exportData.sections
        .map((s) => {
          if (!s || typeof s.heading !== "string" || !s.heading.trim() || !Array.isArray(s.content)) {
            return null;
          }
          const goodContent = s.content.filter(
            (c) => typeof c === "string" && c.trim().length > 0 && isWellFormedBullet(c)
          );
          if (goodContent.length === 0) return null;
          return { ...s, content: goodContent };
        })
        .filter(Boolean);
      return { ...exportData, sections: cleaned };
    }

    /* =========================================================
       CANVAS IMAGE RENDERER (render-image blocks)
       ========================================================= */

    /**
     * Scan rawText for ```render-image ... ``` fenced blocks.
     * For each one found, draw it onto a HiDPI canvas and append a
     * polished image card below bubbleEl.
     *
     * Returns an array of PNG data URLs for each successfully rendered
     * diagram, so they can be embedded into PPTX/PDF exports.
     */
    function parseAndRenderImages(rawText, bubbleEl) {
      const FENCE_RE = /```render-image\s*\n([\s\S]*?)```/gi;
      let match;
      // Collect data URLs of successfully rendered diagrams
      const diagramDataUrls = [];

      while ((match = FENCE_RE.exec(rawText)) !== null) {
        const code = match[1];

        // --- outer card ---
        const card = document.createElement("div");
        card.className = "gen-image-card";

        // --- header row ---
        const header = document.createElement("div");
        header.className = "gen-image-header";

        const label = document.createElement("span");
        label.className = "gen-image-label";
        label.textContent = "Generated diagram";
        header.appendChild(label);

        const dlBtn = document.createElement("button");
        dlBtn.className = "gen-image-download";
        dlBtn.textContent = "⬇ Download PNG";
        header.appendChild(dlBtn);

        card.appendChild(header);

        // --- canvas body ---
        const body = document.createElement("div");
        body.className = "gen-image-body";

        // Use 2× pixel density for crisp HiDPI rendering.
        // The CSS width/height stay at 480×300 (set via CSS class).
        const DPR = 2;
        const CANVAS_W = 480;
        const CANVAS_H = 300;
        const canvas = document.createElement("canvas");
        canvas.width  = CANVAS_W * DPR;
        canvas.height = CANVAS_H * DPR;
        // CSS display size — the class handles max-width and width:100%
        canvas.style.width  = CANVAS_W + "px";
        canvas.style.height = CANVAS_H + "px";

        let renderOk = false;
        try {
          const ctx = canvas.getContext("2d");
          // Scale all drawing commands so code written for 480×300 renders
          // at full 960×600 resolution without any code changes from the AI.
          ctx.scale(DPR, DPR);
          // Execute the AI-generated drawing code with ctx bound
          // eslint-disable-next-line no-new-func
          new Function("ctx", code)(ctx);
          renderOk = true;
        } catch (err) {
          console.warn("render-image code failed:", err);
        }

        if (renderOk) {
          body.appendChild(canvas);
          card.appendChild(body);

          // Capture data URL for export (before any DOM changes)
          const dataUrl = canvas.toDataURL("image/png");
          diagramDataUrls.push(dataUrl);

          // Wire download button
          dlBtn.addEventListener("click", () => {
            const link = document.createElement("a");
            link.download = "navgpt-diagram.png";
            link.href = dataUrl;
            link.click();
          });
        } else {
          const errMsg = document.createElement("div");
          errMsg.className = "gen-image-error";
          errMsg.textContent = "⚠ Diagram could not be rendered — the drawing code returned an error.";
          card.appendChild(errMsg);
          dlBtn.style.display = "none";
        }

        bubbleEl.appendChild(card);
      }

      // Return array of data URLs (empty if none rendered successfully)
      return diagramDataUrls;
    }

    /* =========================================================
       EXPORT BAR
       ========================================================= */
    /**
     * @param {HTMLElement} bubbleEl
     * @param {object} data - parsed export JSON
     * @param {string[]} [diagramDataUrls] - PNG data URLs from rendered canvases
     */
    function addExportBar(bubbleEl, data, diagramDataUrls = []) {
      const bar = document.createElement("div");
      bar.className = "export-bar";

      let bannerDataUrl = null;

      const hasInlineDiagrams = data?.sections?.some(s => !!s.diagramCode);
      const totalDiagrams = diagramDataUrls.length + (hasInlineDiagrams ? data.sections.filter(s => !!s.diagramCode).length : 0);

      // Show a note if diagrams will be embedded in the PPTX
      if (totalDiagrams > 0) {
        const diagramNote = document.createElement("span");
        diagramNote.style.cssText = "font-size:0.75rem;color:var(--accent-dark);font-weight:600;width:100%;";
        diagramNote.textContent = `🖼 Diagram(s) will be embedded in PPTX`;
        bar.appendChild(diagramNote);
      }

      const attachBtn = document.createElement("button");
      attachBtn.type = "button";
      attachBtn.className = "export-btn attach-btn";
      attachBtn.textContent = "📎 Add cover image (optional)";
      attachBtn.addEventListener("click", () => {
        const picker = document.createElement("input");
        picker.type = "file";
        picker.accept = "image/*";
        picker.addEventListener("change", () => {
          const file = picker.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            bannerDataUrl = reader.result;
            attachBtn.textContent = "✓ Cover image added";
            attachBtn.classList.add("has-image");
          };
          reader.readAsDataURL(file);
        });
        picker.click();
      });
      bar.appendChild(attachBtn);

      const footerInput = document.createElement("input");
      footerInput.type = "text";
      footerInput.className = "export-footer-input";
      footerInput.placeholder = "Footer text for every slide/page (optional)";
      footerInput.maxLength = 80;
      bar.appendChild(footerInput);

      [
        { format: "pptx", label: "⬇ PPTX",
          generate: (d, banner, footer) => generatePPTX(d, banner, footer, diagramDataUrls) },
        { format: "docx", label: "⬇ DOCX", generate: generateDOCX },
        { format: "pdf",  label: "⬇ PDF",  generate: generatePDF },
      ].forEach(({ label, generate }) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "export-btn";
        btn.textContent = label;
        const originalLabel = label;
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          btn.textContent = "Generating…";
          try {
            await generate(data, bannerDataUrl, footerInput.value.trim());
          } catch (err) {
            console.error("Export failed:", err);
            alert(`Export failed: ${err && err.message ? err.message : err}`);
          } finally {
            btn.disabled = false;
            btn.textContent = originalLabel;
          }
        });
        bar.appendChild(btn);
      });

      bubbleEl.appendChild(bar);
    }

    /**
     * Helper to render inline diagramCode to a PNG Data URL
     */
    function renderDiagramCodeToDataURL(code) {
      if (!code) return null;
      try {
        const DPR = 2;
        const CANVAS_W = 480;
        const CANVAS_H = 300;
        const canvas = document.createElement("canvas");
        canvas.width  = CANVAS_W * DPR;
        canvas.height = CANVAS_H * DPR;
        const ctx = canvas.getContext("2d");
        ctx.scale(DPR, DPR);
        // eslint-disable-next-line no-new-func
        new Function("ctx", code)(ctx);
        return canvas.toDataURL("image/png");
      } catch (err) {
        console.warn("PPTX diagram rendering failed:", err);
        return null;
      }
    }

    /* =========================================================
       PPTX — 16:9, Grid Layout, Banner Fit, Footer Fixed, Diagrams Embedded
       ========================================================= */
    /**
     * @param {object}   data           - export JSON {title, subtitle, sections}
     * @param {string}   bannerDataUrl  - cover image data URL (optional)
     * @param {string}   footerText     - footer label for every slide
     * @param {string[]} diagramDataUrls - PNG data URLs of rendered canvas diagrams
     */
    async function generatePPTX(data, bannerDataUrl, footerText, diagramDataUrls = []) {
      if (!window.PptxGenJS) throw new Error("pptxgenjs not loaded. Check CDN / ad-blocker.");
      const P = new window.PptxGenJS();
      P.defineLayout({ name: "UNIVERSITY", width: SLIDE_W, height: SLIDE_H });
      P.layout = "UNIVERSITY";

      const W = SLIDE_W;
      const H = SLIDE_H;

      /* Footer helper (applied to every slide) */
      function slideFooter(slide, pageNum) {
        // Hairline
        slide.addShape(P.ShapeType.rect, {
          x: MARGIN, y: H - 0.42, w: W - MARGIN * 2, h: 0.005,
          fill: { color: TOKENS.border }
        });
        // Footer text (left) — was missing before; now included
        if (footerText) {
          slide.addText(footerText, {
            x: MARGIN, y: H - 0.32, w: W / 2 - MARGIN, h: 0.25,
            fontSize: 9, color: TOKENS.muted, align: "left", fontFace: TOKENS.font
          });
        }
        // Page number (right)
        slide.addText(String(pageNum), {
          x: W - MARGIN - 0.9, y: H - 0.32, w: 0.9, h: 0.25,
          fontSize: 9, color: TOKENS.muted, align: "right", fontFace: TOKENS.font
        });
      }

      /* ----- COVER SLIDE ----- */
      const cover = P.addSlide();
      cover.background = { color: TOKENS.cream };

      const sections = data.sections || [];

      /* Banner: fitted strip at top (never full-slide background, never fill) */
      if (bannerDataUrl) {
        const bannerW = W - MARGIN * 2; // 11.633
        const bannerH = 2.2;
        cover.addImage({
          data: bannerDataUrl,
          x: MARGIN,
          y: 0.3,
          w: bannerW,
          h: bannerH,
          sizing: { type: "contain", w: bannerW, h: bannerH }
        });
      } else {
        // Decorative icon grid for cover (if no image is provided)
        const icons = sections.map(s => s.icon).filter(Boolean);
        if (icons.length > 0) {
          const bannerW = W - MARGIN * 2;
          const bannerH = 2.2;
          cover.addShape(P.ShapeType.roundRect, {
            x: MARGIN, y: 0.3, w: bannerW, h: bannerH, rectRadius: 0.08,
            fill: { color: TOKENS.surface }
          });
          const iconsText = icons.join("   ");
          cover.addText(iconsText, {
            x: MARGIN, y: 0.3, w: bannerW, h: bannerH,
            fontSize: 48, align: "center", valign: "middle", color: TOKENS.dark
          });
        } else {
          // Empty banner placeholder (subtle surface)
          cover.addShape(P.ShapeType.roundRect, {
            x: MARGIN, y: 0.3, w: W - MARGIN * 2, h: 2.2, rectRadius: 0.08,
            fill: { color: TOKENS.surface }
          });
        }
      }

      /* Title below banner — no overlap */
      cover.addText(data.title || "Presentation", {
        x: MARGIN, y: 2.7, w: W - MARGIN * 2, h: 1.0,
        fontSize: 36, bold: true, color: TOKENS.dark, fontFace: TOKENS.font, valign: "middle"
      });
      if (data.subtitle) {
        cover.addText(data.subtitle, {
          x: MARGIN, y: 3.7, w: W - MARGIN * 2, h: 0.6,
          fontSize: 16, color: TOKENS.muted, italic: true, fontFace: TOKENS.font
        });
      }

      /* Accent bar */
      cover.addShape(P.ShapeType.rect, {
        x: MARGIN, y: 4.35, w: 2.0, h: 0.04, fill: { color: TOKENS.accent }
      });

      slideFooter(cover, 1);

      /* ----- AGENDA SLIDE ----- */
      if (sections.length > 1) {
        const aSlide = P.addSlide();
        aSlide.background = { color: TOKENS.cream };

        /* Header band: consistent 16% height */
        aSlide.addShape(P.ShapeType.roundRect, {
          x: 0, y: 0, w: W, h: HEADER_H, rectRadius: 0.08,
          fill: { color: TOKENS.dark }
        });
        aSlide.addText("Contents", {
          x: MARGIN, y: 0.3, w: W - MARGIN * 2, h: 0.6,
          fontSize: 28, bold: true, color: TOKENS.white, fontFace: TOKENS.font, valign: "middle"
        });

        /* Grid: 2 columns if > 8 items */
        const cols = sections.length > 8 ? 2 : 1;
        const colW = (W - MARGIN * 2 - 0.4) / cols;
        const gap = 0.4;
        const startX = MARGIN;
        const startY = HEADER_H + 0.4;

        sections.forEach((s, i) => {
          const col = i % cols;
          const row = Math.floor(i / cols);
          const x = startX + col * (colW + gap);
          const y = startY + row * 0.72;

          aSlide.addShape(P.ShapeType.ellipse, {
            x: x, y: y, w: 0.55, h: 0.55, fill: { color: TOKENS.accent }
          });
          aSlide.addText(String(i + 1), {
            x: x, y: y, w: 0.55, h: 0.55, align: "center", valign: "middle",
            fontSize: 15, bold: true, color: TOKENS.white, fontFace: TOKENS.font
          });
          const iconPrefix = s.icon ? `${s.icon} ` : "";
          aSlide.addText(iconPrefix + (s.heading || `Section ${i + 1}`), {
            x: x + 0.7, y: y - 0.05, w: colW - 0.7, h: 0.55,
            fontSize: 14, bold: true, color: TOKENS.dark, fontFace: TOKENS.font, valign: "middle"
          });
        });

        slideFooter(aSlide, 2);
      }

      /* -------------------------------------------------------
         CONTENT SLIDES — dynamic sizing & auto-split
         -------------------------------------------------------
         Layout geometry (inches):
           Body area:  from HEADER_H + 0.3  →  H - SAFE_BOTTOM - 0.15
           Content card fills the entire body area (minus inner padding).
           Bullets are split across multiple slides when they can't all fit.

         Height estimation approach
         ─────────────────────────
         We estimate the rendered height of each bullet by:
           1. Counting approximate wrapped lines = ceil(charCount / CHARS_PER_LINE)
           2. Height per line = (fontSize pt → inches) × lineSpacingMultiple
           3. Adding paraSpaceAfter for each bullet
         This gives a conservative over-estimate which prevents overflow.
      ------------------------------------------------------- */

      // ---- Layout constants ----
      const BODY_TOP     = HEADER_H + 0.3;          // where card starts
      const BODY_BOTTOM  = H - SAFE_BOTTOM - 0.15;  // where card ends
      const BODY_H       = BODY_BOTTOM - BODY_TOP;  // usable card height

      const CARD_PAD_V   = 0.18;   // vertical padding inside card (top+bottom each)
      const CARD_PAD_L   = 0.28;   // left inner padding (bullet indent)
      const TEXT_W       = W - MARGIN * 2 - CARD_PAD_L - 0.07; // text wrap width in inches

      const FONT_SIZE    = 15;      // pt
      const LINE_MULT    = 1.45;    // line spacing multiplier
      const PARA_AFTER   = 0.14;    // inches of space after each bullet

      // Approximate characters per wrapped line at FONT_SIZE, TEXT_W ≈ 11.5 in
      // Empirical: Calibri 15pt → ~0.10 in per char on a 16:9 slide
      const CHAR_W_IN    = 0.092;
      const CHARS_PER_LINE = Math.floor(TEXT_W / CHAR_W_IN);

      // Height of a single line in inches (pt → in = pt / 72)
      const LINE_H_IN    = (FONT_SIZE / 72) * LINE_MULT;

      /** Estimate rendered height (in) for a single bullet string */
      function bulletHeight(text) {
        const wrappedLines = Math.max(1, Math.ceil(text.length / CHARS_PER_LINE));
        return wrappedLines * LINE_H_IN + PARA_AFTER;
      }

      /** Maximum bullet content height that fits inside one card */
      const MAX_CONTENT_H = BODY_H - CARD_PAD_V * 2;

      /**
       * Split an array of bullets into pages where the total estimated height
       * of each page does not exceed MAX_CONTENT_H.
       */
      function paginateBullets(items) {
        const pages = [];
        let currentPage = [];
        let currentH = 0;

        for (const item of items) {
          const h = bulletHeight(item);
          if (currentPage.length > 0 && currentH + h > MAX_CONTENT_H) {
            pages.push(currentPage);
            currentPage = [item];
            currentH = h;
          } else {
            currentPage.push(item);
            currentH += h;
          }
        }
        if (currentPage.length > 0) pages.push(currentPage);
        return pages;
      }

      // ---- Slide counter (starts after cover + agenda) ----
      let slideNum = sections.length > 1 ? 3 : 2;

      // ---- Diagram assignment: distribute diagrams across sections ----
      const sectionDiagrams = {}; // sectionIdx -> dataUrl
      const extraDiagrams = [];  

      // 1. Process inline diagramCode from the sections
      sections.forEach((sec, idx) => {
        if (sec.diagramCode) {
          const url = renderDiagramCodeToDataURL(sec.diagramCode);
          if (url) sectionDiagrams[idx] = url;
        }
      });

      // 2. Process external diagrams (from render-image blocks in chat)
      // We only assign them to sections that don't already have one.
      let extDiagramIdx = 0;
      for (let i = 0; i < sections.length && extDiagramIdx < diagramDataUrls.length; i++) {
        if (!sectionDiagrams[i]) {
          sectionDiagrams[i] = diagramDataUrls[extDiagramIdx++];
        }
      }
      // Any leftovers go to extraDiagrams
      for (; extDiagramIdx < diagramDataUrls.length; extDiagramIdx++) {
        extraDiagrams.push(diagramDataUrls[extDiagramIdx]);
      }

      /* ----- CONTENT SLIDES ----- */
      sections.forEach((sec, idx) => {
        const items = sec.content || [];
        if (!items.length) return;

        const pages = paginateBullets(items);
        const totalPages = pages.length;
        // Diagram (if any) only goes on the FIRST page of this section
        const sectionImg = sectionDiagrams[idx] || null;

        pages.forEach((pageItems, pageIdx) => {
          const iconPrefix = sec.icon ? `${sec.icon} ` : "";
          const slideLabel = totalPages > 1
            ? `${iconPrefix}${sec.heading || `Section ${idx + 1}`} (${pageIdx + 1}/${totalPages})`
            : `${iconPrefix}${sec.heading || `Section ${idx + 1}`}`;

          // On slides WITH a diagram, split the body 60/40 (bullets | image)
          const hasDiagram = sectionImg && pageIdx === 0;
          const BULLET_W_RATIO = hasDiagram ? 0.58 : 1.0;
          const IMG_GAP = 0.18; // gap between bullets and image column
          const cardW = W - MARGIN * 2;
          const bulletColW = hasDiagram
            ? cardW * BULLET_W_RATIO - IMG_GAP / 2
            : TEXT_W;
          const imgColW  = hasDiagram ? cardW * (1 - BULLET_W_RATIO) - IMG_GAP / 2 : 0;
          const imgColX  = MARGIN + cardW * BULLET_W_RATIO + IMG_GAP / 2;

          const s = P.addSlide();
          s.background = { color: TOKENS.cream };

          /* --- Header band --- */
          s.addShape(P.ShapeType.roundRect, {
            x: 0, y: 0, w: W, h: HEADER_H, rectRadius: 0.08,
            fill: { color: TOKENS.dark }
          });
          s.addShape(P.ShapeType.roundRect, {
            x: MARGIN, y: (HEADER_H - 0.2) / 2, w: 0.2, h: 0.2, rectRadius: 0.04,
            fill: { color: TOKENS.accent }
          });
          s.addText(slideLabel, {
            x: MARGIN + 0.35, y: 0.22, w: W - MARGIN * 2 - 0.35, h: 0.75,
            fontSize: totalPages > 1 ? 20 : 24,
            bold: true, color: TOKENS.white, fontFace: TOKENS.font, valign: "middle"
          });

          /* --- Full-height content card --- */
          s.addShape(P.ShapeType.roundRect, {
            x: MARGIN, y: BODY_TOP, w: cardW, h: BODY_H, rectRadius: 0.06,
            fill: { color: TOKENS.white },
            shadow: { type: "outer", color: "BFB5A6", blur: 6, angle: 90, opacity: 0.15 }
          });
          // Left accent bar — full card height
          s.addShape(P.ShapeType.roundRect, {
            x: MARGIN, y: BODY_TOP, w: 0.06, h: BODY_H, rectRadius: 0.03,
            fill: { color: TOKENS.accent }
          });

          /* --- Diagram image column (right side) --- */
          if (hasDiagram) {
            // Thin divider between text and image
            s.addShape(P.ShapeType.rect, {
              x: imgColX - IMG_GAP / 2, y: BODY_TOP + CARD_PAD_V,
              w: 0.005, h: BODY_H - CARD_PAD_V * 2,
              fill: { color: TOKENS.border }
            });
            // The diagram — maintain 16:6.25 canvas aspect ratio (480:300)
            const imgH = Math.min(BODY_H - CARD_PAD_V * 2, imgColW * (300 / 480));
            const imgY = BODY_TOP + CARD_PAD_V + (BODY_H - CARD_PAD_V * 2 - imgH) / 2;
            try {
              s.addImage({
                data: sectionImg,
                x: imgColX,
                y: imgY,
                w: imgColW,
                h: imgH,
                sizing: { type: "contain", w: imgColW, h: imgH }
              });
            } catch (imgErr) {
              console.warn("PPTX: could not embed diagram image:", imgErr);
            }
          }

          /* --- Bullets --- */
          const autoFontSize = pageItems.length <= 4 ? 16
            : pageItems.length <= 6 ? 15
            : pageItems.length <= 8 ? 14
            : 13;

          // Adjust effective text width when we have a diagram column
          const effectiveTextW = hasDiagram
            ? bulletColW - CARD_PAD_L - 0.07
            : TEXT_W;

          const bullets = pageItems.map((c, i) => {
            // First bullet gets an accent highlighted style
            const isHighlight = (i === 0);
            return {
              text: c,
              options: {
                bullet: isHighlight ? false : { code: "25CF", indent: 16 },
                color: isHighlight ? TOKENS.white : TOKENS.dark,
                highlight: isHighlight ? TOKENS.accent : undefined,
                bold: isHighlight,
                breakLine: true,
                paraSpaceAfter: pageItems.length <= 5 ? 14 : 10,
                fontFace: TOKENS.font,
                fontSize: autoFontSize
              }
            };
          });

          s.addText(bullets, {
            x: MARGIN + CARD_PAD_L,
            y: BODY_TOP + CARD_PAD_V,
            w: effectiveTextW,
            h: BODY_H - CARD_PAD_V * 2,
            fontSize: autoFontSize,
            lineSpacing: autoFontSize * LINE_MULT,
            color: TOKENS.dark,
            fontFace: TOKENS.font,
            valign: "top",
            wrap: true
          });

          slideFooter(s, slideNum++);
        });
      });

      /* ----- SUPPLEMENTAL DIAGRAM SLIDES (extras beyond section count) ----- */
      extraDiagrams.forEach((imgUrl, i) => {
        const s = P.addSlide();
        s.background = { color: TOKENS.cream };
        s.addShape(P.ShapeType.roundRect, {
          x: 0, y: 0, w: W, h: HEADER_H, rectRadius: 0.08,
          fill: { color: TOKENS.dark }
        });
        s.addText(`Visual Supplement ${i + 1}`, {
          x: MARGIN + 0.35, y: 0.22, w: W - MARGIN * 2 - 0.35, h: 0.75,
          fontSize: 22, bold: true, color: TOKENS.white, fontFace: TOKENS.font, valign: "middle"
        });
        const maxImgW = W - MARGIN * 2;
        const maxImgH = BODY_H - 0.3;
        const imgH = Math.min(maxImgH, maxImgW * (300 / 480));
        const imgW = imgH * (480 / 300);
        const imgX = MARGIN + (maxImgW - imgW) / 2;
        try {
          s.addImage({
            data: imgUrl,
            x: imgX, y: BODY_TOP + 0.15,
            w: imgW, h: imgH,
            sizing: { type: "contain", w: imgW, h: imgH }
          });
        } catch (imgErr) {
          console.warn("PPTX: could not embed supplemental diagram:", imgErr);
        }
        slideFooter(s, slideNum++);
      });

      /* ----- CLOSING SLIDE ----- */
      const close = P.addSlide();
      close.background = { color: TOKENS.dark };

      close.addShape(P.ShapeType.ellipse, {
        x: -1.0, y: 3.5, w: 5, h: 5,
        fill: { color: TOKENS.accent, transparency: 88 }
      });

      close.addText("Thank You", {
        x: MARGIN, y: 2.5, w: W - MARGIN * 2, h: 1.0,
        fontSize: 48, bold: true, color: TOKENS.white,
        align: "center", fontFace: TOKENS.font
      });
      close.addShape(P.ShapeType.rect, {
        x: W / 2 - 1.0, y: 3.7, w: 2.0, h: 0.04,
        fill: { color: TOKENS.accent }
      });
      close.addText("Questions? Reach out any time.", {
        x: MARGIN, y: 4.1, w: W - MARGIN * 2, h: 0.6,
        fontSize: 16, color: "#F3E4DB", align: "center",
        italic: true, fontFace: TOKENS.font
      });

      slideFooter(close, slideNum);

      const blob = await P.write("blob");
      downloadBlob(blob, `${safeFilename(data.title)}.pptx`);
    }

    /* =========================================================
       DOCX — 16:9 Page Size, Banner Fit, Footer Fixed
       ========================================================= */
    async function generateDOCX(data, bannerDataUrl, footerText) {
      await ensureDocxLoaded();
      if (!window.docx) throw new Error("docx library not loaded.");
      const { Document, Packer, Paragraph, HeadingLevel, ImageRun, TextRun, AlignmentType, Header, Footer, PageNumber, BorderStyle, SectionType } = window.docx;

      const kids = [];

      /* Banner fitted (contain) at top of cover — not full-page background */
      if (bannerDataUrl) {
        kids.push(new Paragraph({
          alignment: AlignmentType.CENTER,
          spacing: { after: 120 },
          children: [new ImageRun({
            data: dataUrlToUint8Array(bannerDataUrl),
            transformation: { width: 520, height: 200 }
          })]
        }));
      }

      kids.push(new Paragraph({
        text: data.title || "Document",
        heading: HeadingLevel.TITLE,
        alignment: AlignmentType.CENTER,
        spacing: { before: 80, after: 120 },
        children: [new TextRun({ text: data.title || "Document", bold: true, color: TOKENS.dark, size: 48, font: TOKENS.font })]
      }));

      if (data.subtitle) kids.push(new Paragraph({
        alignment: AlignmentType.CENTER,
        spacing: { after: 160 },
        children: [new TextRun({ text: data.subtitle, italics: true, color: TOKENS.muted, size: 24, font: TOKENS.font })]
      }));

      kids.push(new Paragraph({
        alignment: AlignmentType.CENTER,
        border: { bottom: { color: TOKENS.accent, space: 6, style: BorderStyle.SINGLE, size: 14 } },
        spacing: { after: 300 }
      }));

      (data.sections || []).forEach((sec, i) => {
        kids.push(new Paragraph({
          heading: HeadingLevel.HEADING_1,
          spacing: { before: 300, after: 120 },
          children: [new TextRun({ text: `${i + 1}.  ${sec.heading || ""}`, bold: true, color: TOKENS.accentDark, size: 28, font: TOKENS.font })]
        }));
        kids.push(new Paragraph({
          spacing: { after: 160 },
          border: { bottom: { color: TOKENS.border, space: 1, style: BorderStyle.SINGLE, size: 4 } }
        }));
        (sec.content || []).forEach(c => kids.push(new Paragraph({
          bullet: { level: 0 },
          spacing: { after: 100 },
          children: [new TextRun({ text: c, size: 20, color: TOKENS.dark, font: TOKENS.font })]
        })));
      });

      const doc = new Document({
        sections: [{
          properties: {
            page: {
              width: 19200,
              height: 10800
            }
          },
          headers: {
            default: new Header({
              children: [new Paragraph({
                alignment: AlignmentType.RIGHT,
                children: [new TextRun({ text: data.title || "Document", size: 16, color: TOKENS.muted, font: TOKENS.font })]
              })]
            })
          },
          footers: {
            default: new Footer({
              children: [new Paragraph({
                alignment: AlignmentType.CENTER,
                spacing: { before: 200 },
                border: { top: { color: TOKENS.border, space: 4, style: BorderStyle.SINGLE, size: 4 } },
                children: [
                  ...(footerText ? [new TextRun({ text: footerText + "   |   ", size: 16, color: TOKENS.muted, font: TOKENS.font })] : []),
                  new TextRun({ text: "Page ", size: 16, color: TOKENS.muted, font: TOKENS.font }),
                  new TextRun({ children: [PageNumber.CURRENT], size: 16, color: TOKENS.muted, font: TOKENS.font })
                ]
              })]
            })
          },
          children: kids
        }]
      });

      const blob = await Packer.toBlob(doc);
      downloadBlob(blob, `${safeFilename(data.title)}.docx`);
    }

    /* =========================================================
       PDF — 16:9 Landscape (960pt x 540pt), Banner Fit, Footer Fixed
       ========================================================= */
    function generatePDF(data, bannerDataUrl, footerText) {
      if (!window.jspdf?.jsPDF) throw new Error("jsPDF not loaded.");
      const { jsPDF } = window.jspdf;

      // True 16:9 landscape (960 pt x 540 pt)
      const pdf = new jsPDF({ orientation: "landscape", unit: "pt", format: [960, 540] });
      const pageW = 960, pageH = 540;
      const mx = 50, my = 30;

      /* ----- COVER ----- */
      pdf.setFillColor(...rgb(TOKENS.dark));
      pdf.rect(0, 0, pageW, pageH, "F");

      pdf.setFillColor(...rgb(TOKENS.accent));
      pdf.setGState(new pdf.GState({ opacity: 0.12 }));
      pdf.circle(pageW + 60, -60, 260, "F");
      pdf.setGState(new pdf.GState({ opacity: 1 }));

      // Banner fitted at top (contain style — no stretch, no full background)
      if (bannerDataUrl) {
        const props = pdf.getImageProperties ? pdf.getImageProperties(bannerDataUrl) : { width: 400, height: 150 };
        const maxW = pageW - mx * 2;
        const maxH = 140;
        let w = maxW;
        let h = (props.height * w) / props.width;
        if (h > maxH) { h = maxH; w = (props.width * maxH) / props.height; }
        const format = bannerDataUrl.includes("image/png") ? "PNG" : "JPEG";
        pdf.addImage(bannerDataUrl, format, mx, 30, w, h);
      }

      pdf.setFillColor(...rgb(TOKENS.accent));
      pdf.rect(mx, 180, 4, 120, "F");

      pdf.setTextColor(255, 255, 255);
      pdf.setFont("helvetica", "bold");
      pdf.setFontSize(30);
      pdf.text(data.title || "Presentation", mx + 14, 230);
      pdf.setFont("helvetica", "italic");
      pdf.setFontSize(13);
      pdf.setTextColor(243, 228, 219);
      pdf.text(data.subtitle || "", mx + 14, 250);

      pdf.setFont("helvetica", "normal");
      pdf.setFontSize(9);
      pdf.setTextColor(...rgb(TOKENS.muted));
      pdf.text("Prepared with NavGPT  •  " + new Date().toLocaleDateString(), mx + 14, 500);

      // Footer line on cover
      pdf.setDrawColor(...rgb(TOKENS.border));
      pdf.setLineWidth(0.4);
      pdf.line(mx, 510, pageW - mx, 510);
      if (footerText) pdf.text(footerText, mx, 525);
      pdf.text("1", pageW - mx, 525, { align: "right" });

      pdf.addPage();

      /* ----- CONTENT PAGES ----- */
      let pdfPageNum = 2; // cover = page 1
      (data.sections || []).forEach((sec, i) => {
        // Dark header band (15-20%)
        pdf.setFillColor(...rgb(TOKENS.dark));
        pdf.roundedRect(0, 0, pageW, 90, 8, 8, "F");

        pdf.setTextColor(...rgb(TOKENS.accent));
        pdf.setFont("helvetica", "bold");
        pdf.setFontSize(11);
        pdf.text("SECTION " + String(i + 1).padStart(2, "0"), mx, 35);

        pdf.setTextColor(255, 255, 255);
        pdf.setFont("helvetica", "bold");
        pdf.setFontSize(20);
        pdf.text(sec.heading || "", mx, 65);

        pdf.setTextColor(...rgb(TOKENS.dark));
        pdf.setFont("helvetica", "normal");
        pdf.setFontSize(12);

        let y = 115;
        (sec.content || []).forEach(c => {
          pdf.setFillColor(...rgb(TOKENS.accent));
          pdf.circle(mx + 5, y + 3, 2, "F");
          const lines = pdf.splitTextToSize(c, pageW - mx * 2 - 12);
          pdf.setTextColor(...rgb(TOKENS.dark));
          pdf.setFont("helvetica", "normal");
          pdf.setFontSize(12);
          pdf.text(lines, mx + 14, y);
          y += lines.length * 14 + 8;
          if (y > 470) {
            // Footer hairline + text before new page
            pdf.setDrawColor(...rgb(TOKENS.border));
            pdf.setLineWidth(0.4);
            pdf.line(mx, 500, pageW - mx, 500);
            pdf.setFontSize(9);
            pdf.setTextColor(...rgb(TOKENS.muted));
            if (footerText) pdf.text(footerText, mx, 515);
            pdf.text(`Page ${pdfPageNum}`, pageW - mx, 515, { align: "right" });
            pdf.addPage();
            pdfPageNum++;
            // Re-draw header on continuation page
            pdf.setFillColor(...rgb(TOKENS.dark));
            pdf.roundedRect(0, 0, pageW, 90, 8, 8, "F");
            pdf.setTextColor(...rgb(TOKENS.accent));
            pdf.setFont("helvetica", "bold");
            pdf.setFontSize(11);
            pdf.text("SECTION " + String(i + 1).padStart(2, "0") + " (cont.)", mx, 35);
            pdf.setTextColor(255, 255, 255);
            pdf.setFont("helvetica", "bold");
            pdf.setFontSize(20);
            pdf.text(sec.heading || "", mx, 65);
            pdf.setTextColor(...rgb(TOKENS.dark));
            pdf.setFont("helvetica", "normal");
            pdf.setFontSize(12);
            y = 115;
          }
        });

        // Footer hairline + text + page number
        pdf.setDrawColor(...rgb(TOKENS.border));
        pdf.setLineWidth(0.4);
        pdf.line(mx, 500, pageW - mx, 500);
        pdf.setFontSize(9);
        pdf.setTextColor(...rgb(TOKENS.muted));
        if (footerText) pdf.text(footerText, mx, 515);
        pdf.text(`Page ${pdfPageNum}`, pageW - mx, 515, { align: "right" });

        // Add a new page between sections (but not after the last one)
        if (i < (data.sections || []).length - 1) {
          pdf.addPage();
          pdfPageNum++;
        }
      });

      downloadBlob(pdf.output("blob"), `${safeFilename(data.title)}.pdf`);
    }

    /* =========================================================
       SHARED UTILITIES
       ========================================================= */
    function safeFilename(title) {
      return (title || "document").replace(/[^a-z0-9\-_ ]/gi, "").trim().slice(0, 60) || "document";
    }

    function downloadBlob(blob, filename) {
      const ext = filename.slice(filename.lastIndexOf(".")).toLowerCase();
      const mimeMap = {
        ".pptx": "application/vnd.openxmlformats-officedocument.presentationml.presentation",
        ".docx": "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
        ".pdf": "application/pdf"
      };
      const mime = mimeMap[ext] || "application/octet-stream";
      const typed = new Blob([blob], { type: mime });
      if (window.saveAs) { window.saveAs(typed, filename); return; }
      if (window.navigator?.msSaveBlob) { window.navigator.msSaveBlob(typed, filename); return; }
      const url = URL.createObjectURL(typed);
      const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    }

    function dataUrlToUint8Array(dataUrl) {
      const base64 = dataUrl.split(",")[1];
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    function ensureDocxLoaded() {
      if (window.docx) return Promise.resolve();
      return new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = "/libs/docx.js";
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    function fitBulletFontSize(items) {
      const totalChars = (items || []).reduce((sum, c) => sum + (c ? c.length : 0), 0);
      if (totalChars > 950) return { fontSize: 12, paraSpaceAfter: 8, lineSpacingMultiple: 1.05 };
      if (totalChars > 750) return { fontSize: 13, paraSpaceAfter: 10, lineSpacingMultiple: 1.08 };
      if (totalChars > 600) return { fontSize: 14, paraSpaceAfter: 12, lineSpacingMultiple: 1.1 };
      if (totalChars > 450) return { fontSize: 15, paraSpaceAfter: 13, lineSpacingMultiple: 1.12 };
      if (totalChars > 300) return { fontSize: 16, paraSpaceAfter: 14, lineSpacingMultiple: 1.13 };
      return { fontSize: 17, paraSpaceAfter: 16, lineSpacingMultiple: 1.15 };
    }

    function fitAgendaFontSize(count) {
      if (count > 16) return { fontSize: 13, paraSpaceAfter: 8 };
      if (count > 12) return { fontSize: 15, paraSpaceAfter: 10 };
      if (count > 8) return { fontSize: 18, paraSpaceAfter: 12 };
      return { fontSize: 20, paraSpaceAfter: 14 };
    }

    /* =========================================================
       MODEL PICKER
       ========================================================= */
    const modelPickerBtn   = document.getElementById("modelPickerBtn");
    const modelPickerPanel = document.getElementById("modelPickerPanel");
    const mpbDot           = document.getElementById("mpbDot");
    const mpbLabel         = document.getElementById("mpbLabel");

    // Provider metadata: icon emoji, colour class, readable name
    const PROVIDER_META = {
      nvidia:      { icon: "⚡", cls: "prov-nvidia",      label: "NVIDIA NIM" },
      openrouter:  { icon: "🔀", cls: "prov-openrouter",  label: "OpenRouter" },
      gemini:      { icon: "✦", cls: "prov-gemini",       label: "Google Gemini" },
    };

    // Dot colour per provider
    const PROVIDER_DOT = {
      nvidia:     "#76b900",
      openrouter: "#6c47ff",
      gemini:     "#4285f4",
    };

    function updatePickerButton(modelId, allModels) {
      const m = allModels.find((x) => x.id === modelId);
      if (!m) return;
      mpbLabel.textContent = m.label;
      mpbDot.style.background = PROVIDER_DOT[m.provider] || "var(--accent)";
    }

    function renderPickerPanel(models) {
      modelPickerPanel.innerHTML = "";
      const groups = {};
      models.forEach((m) => {
        const prov = m.provider || "other";
        if (!groups[prov]) groups[prov] = [];
        groups[prov].push(m);
      });

      Object.entries(groups).forEach(([prov, list]) => {
        const meta = PROVIDER_META[prov] || { icon: "🤖", cls: "", label: prov };

        // Group label
        const grpLabel = document.createElement("div");
        grpLabel.className = "mp-group-label";
        grpLabel.textContent = meta.label;
        modelPickerPanel.appendChild(grpLabel);

        list.forEach((m) => {
          const card = document.createElement("div");
          card.className = "mp-card" + (m.id === selectedModelId ? " selected" : "");
          card.setAttribute("role", "option");
          card.setAttribute("aria-selected", m.id === selectedModelId ? "true" : "false");
          card.dataset.modelId = m.id;

          card.innerHTML = `
            <span class="mp-icon ${meta.cls}">${meta.icon}</span>
            <span class="mp-info">
              <span class="mp-name">${m.label}</span>
              <span class="mp-badge">${meta.label}</span>
            </span>
            <span class="mp-check">✓</span>
          `;

          card.addEventListener("click", () => {
            selectedModelId = m.id;
            updatePickerButton(m.id, models);
            // refresh selection highlight
            modelPickerPanel.querySelectorAll(".mp-card").forEach((c) => {
              const isSelected = c.dataset.modelId === m.id;
              c.classList.toggle("selected", isSelected);
              c.setAttribute("aria-selected", String(isSelected));
            });
            closePickerPanel();
          });

          modelPickerPanel.appendChild(card);
        });
      });
    }

    function openPickerPanel() {
      modelPickerPanel.classList.add("open");
      modelPickerBtn.classList.add("open");
      modelPickerBtn.setAttribute("aria-expanded", "true");
    }

    function closePickerPanel() {
      modelPickerPanel.classList.remove("open");
      modelPickerBtn.classList.remove("open");
      modelPickerBtn.setAttribute("aria-expanded", "false");
    }

    modelPickerBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (modelPickerPanel.classList.contains("open")) {
        closePickerPanel();
      } else {
        openPickerPanel();
      }
    });

    document.addEventListener("click", (e) => {
      if (!document.getElementById("modelPickerWrap").contains(e.target)) {
        closePickerPanel();
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closePickerPanel();
    });

    async function loadModels() {
      modelsLoaded = false;
      mpbLabel.textContent = "Loading…";
      mpbDot.style.background = "var(--muted)";
      try {
        const idToken = await currentUser.getIdToken();
        const res = await fetch(`${BACKEND_URL}/api/models`, {
          headers: { Authorization: `Bearer ${idToken}` },
        });
        const data = await res.json();
        const models = data.models || [];
        if (models.length) {
          selectedModelId = models[0].id;
          modelsLoaded = true;
          renderPickerPanel(models);
          updatePickerButton(selectedModelId, models);
        } else {
          selectedModelId = null;
          mpbLabel.textContent = "No models";
          mpbDot.style.background = "var(--muted)";
        }
      } catch (err) {
        console.error("Failed to load models:", err);
        mpbLabel.textContent = "Unavailable";
        mpbDot.style.background = "var(--muted)";
        selectedModelId = null;
      }
    }

    /* =========================================================
       CHAT SESSIONS
       ========================================================= */
    function chatsCol(uid) { return collection(db, "users", uid, "chats"); }
    function messagesCol(uid, chatId) { return collection(db, "users", uid, "chats", chatId, "messages"); }

    function renderChatItem(uid, docSnap) {
      const d = docSnap.data();
      const item = document.createElement("div");
      item.className = "chat-item" + (docSnap.id === currentChatId ? " active" : "");
      const titleSpan = document.createElement("span");
      titleSpan.className = "chat-title";
      titleSpan.textContent = d.title || "New chat";
      const delBtn = document.createElement("span");
      delBtn.className = "chat-delete";
      delBtn.title = "Delete";
      delBtn.setAttribute("role", "button");
      delBtn.setAttribute("aria-label", `Delete chat: ${d.title || "New chat"}`);
      delBtn.textContent = "✕";
      titleSpan.addEventListener("click", () => selectChat(uid, docSnap.id));
      delBtn.addEventListener("click", async (e) => {
        e.stopPropagation();
        await deleteDoc(doc(db, "users", uid, "chats", docSnap.id));
        await loadChatList(uid, { reset: true });
      });
      item.appendChild(titleSpan);
      item.appendChild(delBtn);
      return item;
    }

    async function loadChatList(uid, opts = {}) {
      const { reset = false } = opts;
      if (reset) {
        chatsLastDoc = null;
        chatsExhausted = false;
        chatListEl.innerHTML = "";
      }

      const constraints = [orderBy("updatedAt", "desc"), limit(CHATS_PAGE_SIZE)];
      if (chatsLastDoc) constraints.splice(1, 0, startAfter(chatsLastDoc));
      const q = query(chatsCol(uid), ...constraints);
      const snap = await getDocs(q);

      if (snap.empty && !chatsLastDoc) {
        await createNewChat(uid, true);
        return;
      }

      const existingBtn = document.getElementById("loadMoreChatsBtn");
      if (existingBtn) existingBtn.remove();

      snap.forEach((docSnap) => {
        chatListEl.appendChild(renderChatItem(uid, docSnap));
      });

      if (!snap.empty) chatsLastDoc = snap.docs[snap.docs.length - 1];
      chatsExhausted = snap.size < CHATS_PAGE_SIZE;

      if (!chatsExhausted) {
        const btn = document.createElement("button");
        btn.id = "loadMoreChatsBtn";
        btn.textContent = "Load more chats";
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          btn.textContent = "Loading…";
          await loadChatList(uid, { reset: false });
        });
        chatListEl.appendChild(btn);
      }

      if (!currentChatId && snap.docs.length) {
        await selectChat(uid, snap.docs[0].id);
      }
    }

    async function createNewChat(uid, autoSelect) {
      const ref = doc(chatsCol(uid));
      await setDoc(ref, { title: "New chat", createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
      if (autoSelect !== false) {
        currentChatId = null;
        await loadChatList(uid, { reset: true });
      }
      return ref.id;
    }

    async function selectChat(uid, chatId) {
      if (activeController && activeRequestChatId !== chatId) {
        activeController.abort();
      }

      currentChatId = chatId;
      closeSidebar();
      chatWindow.innerHTML = "";
      history = [];
      messagesFirstDoc = null;
      messagesExhausted = false;

      await loadOlderMessages(uid, chatId, { initial: true });
      await loadChatList(uid, { reset: true });
    }

    async function loadOlderMessages(uid, chatId, opts = {}) {
      const { initial = false } = opts;
      const constraints = [orderBy("createdAt", "desc"), limit(MESSAGES_PAGE_SIZE)];
      if (messagesFirstDoc) constraints.splice(1, 0, startAfter(messagesFirstDoc));
      const q = query(messagesCol(uid, chatId), ...constraints);
      const snap = await getDocs(q);

      if (snap.empty) {
        messagesExhausted = true;
        if (loadMoreMessagesBtn) loadMoreMessagesBtn.remove();
        return;
      }

      const docsAsc = [...snap.docs].reverse();
      const scrollAnchor = chatWindow.scrollHeight - chatWindow.scrollTop;

      const fragment = document.createDocumentFragment();
      const newHistoryEntries = [];
      docsAsc.forEach((docSnap) => {
        const d = docSnap.data();
        const userRow = renderMessage("user", d.userMessage);
        const botRow = renderMessage("bot", d.reply);
        fragment.appendChild(userRow);
        fragment.appendChild(botRow);
        newHistoryEntries.push({ role: "user", content: d.userMessage }, { role: "assistant", content: d.reply });
      });

      if (initial) {
        chatWindow.appendChild(fragment);
        history = newHistoryEntries;
        chatWindow.scrollTop = chatWindow.scrollHeight;
      } else {
        chatWindow.insertBefore(fragment, chatWindow.firstChild);
        history = [...newHistoryEntries, ...history];
        chatWindow.scrollTop = chatWindow.scrollHeight - scrollAnchor;
      }

      messagesFirstDoc = snap.docs[snap.docs.length - 1];
      messagesExhausted = snap.size < MESSAGES_PAGE_SIZE;

      if (loadMoreMessagesBtn) loadMoreMessagesBtn.remove();
      if (!messagesExhausted) {
        loadMoreMessagesBtn = document.createElement("button");
        loadMoreMessagesBtn.id = "loadMoreMessagesBtn";
        loadMoreMessagesBtn.textContent = "Load older messages";
        loadMoreMessagesBtn.addEventListener("click", async () => {
          loadMoreMessagesBtn.disabled = true;
          loadMoreMessagesBtn.textContent = "Loading…";
          await loadOlderMessages(uid, chatId, { initial: false });
        });
        chatWindow.insertBefore(loadMoreMessagesBtn, chatWindow.firstChild);
      } else {
        loadMoreMessagesBtn = null;
      }
    }

    newChatBtn.addEventListener("click", async () => {
      if (!currentUser) return;
      const id = await createNewChat(currentUser.uid, false);
      await selectChat(currentUser.uid, id);
    });

    /* =========================================================
       AUTH
       ========================================================= */
    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      if (user) {
        authArea.innerHTML = `
        <div id="userInfo">
          <div class="user-avatar">${initials(user.displayName || user.email)}</div>
          <span>${user.displayName || user.email}</span>
          <button id="signOutBtn">Sign out</button>
        </div>`;
        document.getElementById("signOutBtn").onclick = () => signOut(auth);
        inputBar.style.display = "flex";
        currentChatId = null;
        history = [];
        if (activeController) { activeController.abort(); activeController = null; }
        await loadModels();
        await loadChatList(user.uid, { reset: true });
      } else {
        if (activeController) { activeController.abort(); activeController = null; }
        authArea.innerHTML = `<button id="signInBtn">Sign in with Google</button>`;
        document.getElementById("signInBtn").onclick = () =>
          signInWithPopup(auth, new GoogleAuthProvider());
        inputBar.style.display = "none";
        chatListEl.innerHTML = "";
        modelPickerPanel.innerHTML = "";
        modelPickerPanel.classList.remove("open");
        modelPickerBtn.classList.remove("open");
        modelPickerBtn.setAttribute("aria-expanded", "false");
        mpbLabel.textContent = "Sign in first";
        mpbDot.style.background = "var(--muted)";
        currentChatId = null;
        history = [];
        chatWindow.innerHTML = `
        <div id="signedOutNotice">
          <div class="empty-mark" id="emptyMark"></div>
          <h2>Welcome to NavGPT</h2>
          <p>Sign in to start chatting with Naveen — your conversation history is saved to your account.</p>
        </div>`;
        document.getElementById("emptyMark").innerHTML = iconImg(false);
      }
    });

    /* =========================================================
       SEND MESSAGE
       ========================================================= */
    async function send() {
      const text = messageInput.value.trim();
      if (!text || !currentUser) return;

      if (!currentChatId) {
        alert("Still setting up your chat — please try again in a moment.");
        return;
      }

      if (!modelsLoaded || !selectedModelId) {
        alert("Models are still loading (or failed to load) — please wait a moment and try again.");
        return;
      }

      const sendChatId = currentChatId;
      messageInput.value = "";
      messageInput.style.height = "auto";
      sendBtn.disabled = true;
      renderMessage("user", text);
      chatWindow.scrollTop = chatWindow.scrollHeight;
      renderTyping();

      if (activeController) activeController.abort();
      const controller = new AbortController();
      activeController = controller;
      activeRequestChatId = sendChatId;

      let stream = null;
      let fullReply = "";

      try {
        const idToken = await currentUser.getIdToken();
        const res = await fetch(`${BACKEND_URL}/api/chat`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${idToken}`,
          },
          body: JSON.stringify({ message: text, history, modelId: selectedModelId, responseMode }),
          signal: controller.signal,
        });

        if (!res.ok || !res.body) throw new Error(`Backend responded with ${res.status}`);

        const isStillActiveChat = () => currentChatId === sendChatId;

        removeTyping();
        stream = createStreamingBubble();

        // Show student-mode badge at top of the bubble
        if (responseMode === "student") {
          const tag = document.createElement("div");
          tag.className = "student-mode-tag";
          tag.textContent = "🎓 Student Mode — real-world examples";
          stream.bubbleEl.insertBefore(tag, stream.bubbleEl.firstChild);
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop();

          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed.startsWith("data:")) continue;
            const data = trimmed.slice(5).trim();
            if (!data) continue;
            let event;
            try { event = JSON.parse(data); } catch { continue; }

            if (!isStillActiveChat()) continue;

            if (event.type === "queued") {
              stream.setQueueStatus(event.position, event.total, event.estimatedWaitSeconds);
            } else if (event.type === "reasoning") {
              stream.appendReasoning(event.text);
            } else if (event.type === "content") {
              stream.appendContent(event.text);
              fullReply += event.text;
            } else if (event.type === "error") {
              fullReply += `\n[${event.message}]`;
              stream.appendContent(`\n${event.message}`);
            } else if (event.type === "done") {
              stream.finish();
            }
          }
        }

        if (!fullReply.trim()) {
          console.warn("Model returned an empty response.");
          if (isStillActiveChat()) {
            stream.contentEl.innerHTML = renderMarkdown(
              "_The model didn't return any content. This can happen if the selected model is unavailable, misconfigured, or doesn't support streaming. Try again, or switch models._"
            );
          }
        }

        const { displayText, exportData, wasTruncated } = parseExportBlock(fullReply);
        let finalExportData = exportData;
        let usedFallbackTemplate = false;
        if (!finalExportData && looksLikeDocumentRequest(text) && fullReply.trim()) {
          finalExportData = buildFallbackExportData(text, fullReply);
          usedFallbackTemplate = !!finalExportData;
        }

        // Strip render-image blocks from display/storage text
        const cleanRenderImage = (txt) => txt.replace(/```render-image[\s\S]*?```/gi, "").trim();

        // Render canvas diagrams and collect their data URLs for PPTX embedding
        const diagramDataUrls = parseAndRenderImages(fullReply, stream.bubbleEl);

        if (isStillActiveChat()) {
          if (exportData) {
            let noteHtml = "";
            if (wasTruncated) {
              noteHtml = `<p style="color:var(--muted);font-size:0.82rem;font-style:italic;margin-top:8px;">⚠ The response was cut short (or a garbled line was removed), so this file may have fewer slides/sections/bullets than you asked for.</p>`;
            }
            stream.contentEl.innerHTML = renderMarkdown(cleanRenderImage(displayText || "Here's what I put together:")) + noteHtml;
            addExportBar(stream.bubbleEl, exportData, diagramDataUrls);
          } else if (usedFallbackTemplate) {
            const noteHtml = `<p style="color:var(--muted);font-size:0.82rem;font-style:italic;margin-top:8px;">ℹ️ Auto-built from headings and bullets in the response. Worth a quick check before relying on it.</p>`;
            stream.contentEl.innerHTML = renderMarkdown(cleanRenderImage(fullReply)) + noteHtml;
            addExportBar(stream.bubbleEl, finalExportData, diagramDataUrls);
          } else {
            // Update content to strip render-image blocks from visible markdown
            stream.contentEl.innerHTML = renderMarkdown(cleanRenderImage(fullReply));
          }
        }
        const cleanReply = exportData ? cleanRenderImage(displayText) : cleanRenderImage(fullReply);

        const chatRef = doc(db, "users", currentUser.uid, "chats", sendChatId);
        await addDoc(messagesCol(currentUser.uid, sendChatId), {
          userMessage: text,
          reply: cleanReply,
          createdAt: serverTimestamp(),
        });

        if (isStillActiveChat()) {
          history.push({ role: "user", content: text });
          history.push({ role: "assistant", content: cleanReply });
        }

        const existingMsgsSnap = await getDocs(query(messagesCol(currentUser.uid, sendChatId), limit(2)));
        const isFirstMessage = existingMsgsSnap.size <= 1;
        await setDoc(
          chatRef,
          {
            updatedAt: serverTimestamp(),
            ...(isFirstMessage ? { title: text.slice(0, 40) + (text.length > 40 ? "…" : "") } : {}),
          },
          { merge: true }
        );
        if (isFirstMessage) await loadChatList(currentUser.uid, { reset: true });
      } catch (err) {
        if (err && err.name === "AbortError") {
          console.info("Request aborted.");
        } else {
          console.error(err);
          removeTyping();
          if (stream) {
            stream.finish();
            if (currentChatId === sendChatId) {
              stream.contentEl.innerHTML = renderMarkdown("_Sorry, something went wrong. Your draft has been restored — try again._");
            }
          } else if (currentChatId === sendChatId) {
            renderMessage("bot", "Sorry, something went wrong. Please try again.");
          }
          if (!messageInput.value) {
            messageInput.value = text;
            messageInput.style.height = "auto";
            messageInput.style.height = Math.min(messageInput.scrollHeight, 140) + "px";
          }
        }
      } finally {
        if (activeController === controller) activeController = null;
        sendBtn.disabled = false;
        messageInput.focus();
      }
    }

    sendBtn.addEventListener("click", send);
    messageInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    // Fix for iOS Safari bug where page stays scrolled up after keyboard closes
    messageInput.addEventListener("blur", () => {
      window.scrollTo(0, 0);
      document.body.scrollTop = 0;
    });
  </script>
</body>

</html>
